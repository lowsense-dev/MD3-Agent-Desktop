# Tests, then one runnable folder (jar + jlinked runtime), then a package per format, each installed and started
# (--version, --check-environment) on its own distribution; the AppImage also on an older one. Tags v* publish them
# as a GitHub release.
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit and screen tests
        run: ./gradlew :app:test
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/test

  dist:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Runnable folder
        run: packaging/build-dist.sh
      - name: Smoke start
        run: |
          dist/md3-agent/bin/md3-agent --version
          dist/md3-agent/bin/md3-agent --check-environment
      # A tarball keeps the executable bits that a plain artifact upload would lose.
      - run: tar -czf md3-agent-dist.tar.gz -C dist md3-agent
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: md3-agent-dist.tar.gz

  deb:
    needs: dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: mkdir -p dist && tar -xzf md3-agent-dist.tar.gz -C dist
      - name: Build .deb
        run: packaging/deb/build-deb.sh
      - name: Install and start
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/md3-agent_*_amd64.deb
          md3-agent --version
          md3-agent --check-environment
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  rpm:
    needs: dist
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Tools
        run: dnf install -y rpm-build tar gzip findutils
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: mkdir -p dist && tar -xzf md3-agent-dist.tar.gz -C dist
      - name: Build .rpm
        run: packaging/rpm/build-rpm.sh
      - name: Install and start
        run: |
          dnf install -y ./dist/md3-agent-*.rpm
          md3-agent --version
          md3-agent --check-environment
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/*.rpm

  pacman:
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git jdk21-openjdk libxtst libxi alsa-lib fontconfig
      - uses: actions/checkout@v7
      # makepkg refuses to run as root.
      - name: Build package
        run: |
          useradd -m builder
          mkdir -p "$GITHUB_WORKSPACE/dist"
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && PKGDEST='$GITHUB_WORKSPACE/dist' makepkg -f --noconfirm"
      - name: Install and start
        run: |
          pacman -U --noconfirm dist/md3-agent-*.pkg.tar.zst
          md3-agent --version
          md3-agent --check-environment
      - uses: actions/upload-artifact@v7
        with:
          name: pacman
          path: dist/*.pkg.tar.zst

  appimage:
    needs: dist
    runs-on: ubuntu-24.04
    env:
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      # Runners have no FUSE: AppImages (appimagetool itself and ours) unpack and run instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: mkdir -p dist && tar -xzf md3-agent-dist.tar.gz -C dist
      - name: appimagetool (pinned, checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/bin/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh
      - name: Start
        run: |
          chmod +x dist/*.AppImage
          ./dist/MD3_Agent-*-x86_64.AppImage --version
          ./dist/MD3_Agent-*-x86_64.AppImage --check-environment
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage

  # The point of an AppImage is running anywhere: start it on a different, older distribution than it was built on.
  appimage-portable:
    needs: appimage
    runs-on: ubuntu-24.04
    container: debian:12
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: appimage
      - name: Start on Debian 12
        run: |
          chmod +x MD3_Agent-*-x86_64.AppImage
          ./MD3_Agent-*-x86_64.AppImage --version
          ./MD3_Agent-*-x86_64.AppImage --check-environment

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, pacman, appimage-portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
            artifacts/pacman/*.pkg.tar.zst
            artifacts/appimage/*.AppImage
